[workspace]
members = ["crates/pimate-protocol"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
