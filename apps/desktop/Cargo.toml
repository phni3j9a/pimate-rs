[package]
name = "pimate-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
gpui = "=0.2.2"
gpui-component = "=0.5.1"
pimate-core = { path = "../../crates/pimate-core" }
pimate-markdown = { path = "../../crates/pimate-markdown" }
pimate-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
async-channel = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
base64.workspace = true
sha2.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }
uuid.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
oo7 = { version = "0.5", default-features = false, features = ["async-std", "native_crypto"] }
futures-lite = "2"
async-io = "2"
