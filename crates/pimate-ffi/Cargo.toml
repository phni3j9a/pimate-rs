[package]
name = "pimate-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
pimate-core = { path = "../pimate-core" }
pimate-markdown = { path = "../pimate-markdown" }
pimate-protocol.workspace = true
uniffi = "~0.32.2"
log = "0.4"
thiserror = "2"

[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "pimate-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[target.'cfg(target_vendor = "apple")'.dependencies]
oslog = "0.2"
