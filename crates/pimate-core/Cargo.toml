[package]
name = "pimate-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
pimate-protocol.workspace = true
serde_json.workspace = true
futures-util.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
uuid.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json"] }
indexmap = "2"
thiserror = "2"
serde.workspace = true
base64.workspace = true
# Both debug and release: downstream runtime filters must never enable raw HTTP/WS frames.
log = { version = "0.4", features = ["max_level_debug", "release_max_level_info"] }
tracing = { version = "0.1", default-features = false, features = ["max_level_debug", "release_max_level_info"] }
