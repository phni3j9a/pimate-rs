name: Host npm package
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm latest and attach to the existing host-vX.Y.Z tag'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  binary:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, dir: linux-x64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, dir: linux-arm64 }
          - { runner: macos-latest, target: x86_64-apple-darwin, dir: darwin-x64 }
          - { runner: macos-latest, target: aarch64-apple-darwin, dir: darwin-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools
      - run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked -p pimate-host --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/pimate .
      - if: runner.os == 'Linux'
        run: |
          readelf -l pimate > headers
          if grep -q INTERP headers; then exit 1; fi
          ./pimate --help
      - if: matrix.dir == 'darwin-arm64'
        run: |
          codesign --verify --strict pimate
          codesign -dv --verbose=4 pimate 2>&1 | grep 'Signature=adhoc'
          ./pimate --help
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dir }}
          path: pimate
  pack:
    needs: binary
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/pimate
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - uses: actions/download-artifact@v4
        with:
          path: packages/pimate/bin
      - run: |
          npm ci
          npm run package
          cd dist/package && npm pack --pack-destination ..
      - run: python3 scripts/pack-smoke.py dist/*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: packages/pimate/dist/*.tgz
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(github.ref, 'refs/tags/host-v')
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Publish verified tarball (explicit opt-in only)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo 'Missing NPM_TOKEN; nothing published'; exit 1; }
          version=$(tar xOf *.tgz package/package.json | jq -r .version)
          test "$GITHUB_REF_NAME" = "host-v$version"
          npm publish ./*.tgz --access public
          gh release create "$GITHUB_REF_NAME" ./*.tgz --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
