name: iOS
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - run: command -v xcodegen || brew install xcodegen
      - name: Verify a test UDID is required
        run: |
          rc=0; apps/ios/test.sh || rc=$?; test "$rc" = 64
      - name: Test on the disposable Actions runner
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for k,ds in json.load(sys.stdin)["devices"].items() if ".iOS-" in k for d in ds if d["name"].startswith("iPhone") and d["state"]=="Shutdown"))')
          apps/ios/test.sh "$id"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-probe
          path: apps/ios/build/attachments
          if-no-files-found: error
