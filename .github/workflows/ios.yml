name: iOS
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - run: command -v xcodegen || brew install xcodegen
      - name: Verify a test UDID is required
        run: |
          rc=0; apps/ios/test.sh || rc=$?; test "$rc" = 64
      - name: Test on a new disposable simulator
        run: apps/ios/test-disposable.sh
      - name: Compose mock, light, dark and large-text comparisons
        if: ${{ !cancelled() && hashFiles('apps/ios/build/attachments/*/manifest.json') != '' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/pi-images"
          "$RUNNER_TEMP/pi-images/bin/pip" install Pillow==11.3.0
          "$RUNNER_TEMP/pi-images/bin/python" apps/ios/compare.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('apps/ios/build/comparison/*.webp') != '' }}
        with:
          name: ios-comparison
          path: apps/ios/build/comparison
          if-no-files-found: error
