name: Desktop packages
on:
  pull_request:
    paths: ['apps/desktop/**', 'crates/**', 'Cargo.*', 'vendor/**', 'docs/design/icon-kit/desktop/**', 'packages/pimate/notices/licenses.hbs', 'LICENSE', '.github/workflows/desktop-package.yml']
  push:
    branches: [main]
    paths: ['apps/desktop/**', 'crates/**', 'Cargo.*', 'vendor/**', 'docs/design/icon-kit/desktop/**', 'packages/pimate/notices/licenses.hbs', 'LICENSE', '.github/workflows/desktop-package.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing desktop-vX.Y.Z tag on main
        type: string
      publish:
        description: Publish the packages to GitHub Releases
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.select.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: bash apps/desktop/tests/release.sh && python3 apps/desktop/tests/check-archive.py
      - id: select
        env:
          TAG: ${{ inputs.release_tag }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          sha=$GITHUB_SHA
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            test "$GITHUB_REF" = refs/heads/main
            if [[ -n $TAG || $PUBLISH == true ]]; then sha=$(bash apps/desktop/check-release.sh "$TAG"); fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.select.outputs.sha }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - run: cargo about generate --locked --fail --manifest-path apps/desktop/Cargo.toml -c apps/desktop/about.toml packages/pimate/notices/licenses.hbs -o crates.txt
      - uses: actions/upload-artifact@v4
        with:
          name: crate-notices
          path: crates.txt
  build:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_PROFILE_RELEASE_STRIP: debuginfo
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
      - run: rustup update stable && rustup default stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libfontconfig1-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev
      - if: runner.os == 'macOS'
        run: xcrun -sdk macosx metal -v || xcodebuild -downloadComponent MetalToolchain
      - uses: actions/download-artifact@v4
        with:
          name: crate-notices
      - run: cargo build --release --locked -p pimate-desktop && apps/desktop/package.sh crates.txt
      - name: Record the Linux executable's version on its own architecture
        if: runner.os == 'Linux'
        run: |
          bin=target/release/pimate-desktop
          mkdir receipts
          { "$bin" --version; sha256sum "$bin" | cut -d' ' -f1; } > "receipts/$(uname -m).txt"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: version-${{ matrix.runner }}
          path: receipts/*.txt
      - name: Verify the contents of the new archive
        run: |
          version=$(cargo metadata --no-deps --locked --format-version 1 | jq -er '.packages[] | select(.name == "pimate-desktop").version')
          python3 apps/desktop/check-archive.py "$version" receipts dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.runner }}
          path: dist/*
          if-no-files-found: error
  prepare-release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: [source, build]
    runs-on: macos-latest
    environment: desktop-release
    outputs:
      signing: ${{ steps.sign.outputs.signing }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: archives
          merge-multiple: true
      - id: sign
        name: Optionally sign and notarize the macOS apps
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
          ASC_KEY: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: bash apps/desktop/notarize.sh archives/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: archives/*
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: [source, prepare-release]
    runs-on: ubuntu-latest
    environment: desktop-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: archives
      - uses: actions/download-artifact@v4
        with:
          pattern: version-*
          path: receipts
          merge-multiple: true
      - env:
          TAG: ${{ inputs.release_tag }}
          SIGNING: ${{ needs.prepare-release.outputs.signing }}
          BUILT_SHA: ${{ needs.source.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(bash apps/desktop/check-release.sh "$TAG")" = "$BUILT_SHA"
          prefix="archives/PiMate-Desktop-${TAG#desktop-v}-"
          files=("$prefix"macos-{arm64,x86_64}.zip "$prefix"linux-{aarch64,x86_64}.tar.gz)
          python3 apps/desktop/check-archive.py "${TAG#desktop-v}" receipts "${files[@]}"
          case "$SIGNING" in 'ad-hoc・未公証'|'Developer ID 署名・公証済み') ;; *) exit 1 ;; esac
          gh release create "$TAG" "${files[@]}" --verify-tag --notes "macOS: $SIGNING" --generate-notes --latest=false
